<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ink Run Rush</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-container" aria-label="Ink Run Rush">
    <canvas id="gameCanvas"></canvas>

    <button id="pause-btn" class="icon-btn" aria-label="Pause game" type="button">
      <span class="pause-bars" aria-hidden="true"><span></span><span></span></span>
    </button>

    <section id="overlay" class="game-overlay" aria-live="polite">
      <p id="overlay-kicker">Pressed To Impress Arcade</p>
      <h1 id="overlay-title">Ink Run Rush</h1>
      <p id="overlay-score">Swipe lanes, jump hazards, slide under gates, and collect ink coins.</p>
      <button id="restart-btn" class="primary-btn" type="button">Start Run</button>
      <button id="arcade-btn" class="secondary-btn hidden" type="button">Back to Arcade</button>
      <p id="overlay-help">Keyboard: arrows or WASD. Mobile: swipe or use controls.</p>
    </section>

    <nav id="mobile-controls" aria-label="Mobile controls">
      <button class="ctrl-btn" id="btn-left" type="button" aria-label="Move left">&#9664;</button>
      <div id="ctrl-center">
        <button class="ctrl-btn" id="btn-up" type="button" aria-label="Jump">&#9650;</button>
        <button class="ctrl-btn" id="btn-down" type="button" aria-label="Slide">&#9660;</button>
      </div>
      <button class="ctrl-btn" id="btn-right" type="button" aria-label="Move right">&#9654;</button>
      <button class="ctrl-btn ctrl-btn-jump" id="btn-jump" type="button">JUMP</button>
    </nav>
  </main>

  <script src="game.js"></script>
</body>
</html>
